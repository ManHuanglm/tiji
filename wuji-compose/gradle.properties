# CI 安全上限:GitHub ubuntu-latest runner 总内存 7GB,OS ~1GB,留给 Gradle+Kotlin 守护进程共 5GB
# 避免同时开 6GB+2GB=8GB 超出物理内存导致 Gradle daemon OOM 崩溃(远程构建头号杀手)
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m

# 启用Compose增量编译
compose.kotlin.uast.enabled=true

# AndroidX 支持(必须开启,否则 Compose Multiplatform 的 androidx 依赖会编译失败)
android.useAndroidX=true
android.nonTransitiveRClass=true
