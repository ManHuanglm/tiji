org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# 沙箱网络出口代理
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# 启用Compose增量编译
compose.kotlin.uast.enabled=true

# AndroidX 支持(必须开启,否则 Compose Multiplatform 的 androidx 依赖会编译失败)
android.useAndroidX=true
android.nonTransitiveRClass=true
