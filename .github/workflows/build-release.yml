name: Build & Release

# ================= 触发条件 =================
# - push 到 main: 产出 APK 与桌面包 Artifact(用于测试/下载)
# - push tag v* : 同上 + 自动发布到 GitHub Releases
# - workflow_dispatch: 手动点 Actions 也可触发构建
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 所需权限(GitHub 内置 GITHUB_TOKEN)
  packages: write

jobs:
  # ============ Android APK 构建(每次 push 必跑) ============
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant Execute Permission (Gradle Wrapper)
        working-directory: wuji-compose
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: wuji-compose
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK (备用,便于未签名场景安装)
        working-directory: wuji-compose
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      # 重命名 APK,带版本号和 Git 短 SHA 便于区分
      - name: Rename APK artifacts
        id: rename
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA:0:7}"
          VERSION="0.0.02"
          APK_DIR="wuji-compose/composeApp/build/outputs/apk"
          for f in "$APK_DIR/release/"*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            mv "$f" "$APK_DIR/release/wuji-v${VERSION}-${SHORT_SHA}-release.apk"
          done
          for f in "$APK_DIR/debug/"*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            mv "$f" "$APK_DIR/debug/wuji-v${VERSION}-${SHORT_SHA}-debug.apk"
          done
          echo "apk_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "apk_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuji-android-apk-${{ steps.rename.outputs.apk_version }}-${{ steps.rename.outputs.apk_sha }}
          path: |
            wuji-compose/composeApp/build/outputs/apk/release/*.apk
            wuji-compose/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ============ 桌面端安装包构建(三平台并行) ============
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-task: packageDeb
            artifact-name: wuji-desktop-linux
            ext: deb
          - os: windows-latest
            gradle-task: packageMsi
            artifact-name: wuji-desktop-windows
            ext: msi
          - os: macos-latest
            gradle-task: packageDmg
            artifact-name: wuji-desktop-macos
            ext: dmg
    runs-on: ${{ matrix.os }}
    # Windows msi 打包对 WiX/jpackage 版本敏感,允许失败不阻断 Release 发布
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant Execute Permission (Gradle Wrapper)
        if: runner.os != 'Windows'
        working-directory: wuji-compose
        run: chmod +x gradlew

      - name: Build Desktop Distribution
        working-directory: wuji-compose
        run: ./gradlew :composeApp:${{ matrix.gradle-task }} --no-daemon
        shell: bash

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            wuji-compose/composeApp/build/compose/binaries/**/*.${{ matrix.ext }}
          if-no-files-found: warn
          retention-days: 30

  # ============ 发布到 GitHub Releases (仅 tag 触发) ============
  release:
    name: Publish Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build-android.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 无极 Wuji ${{ github.ref_name }}
          body: |
            ## 无极 Wuji ${{ github.ref_name }}

            ### 版本号
            - versionName: `0.0.02`
            - versionCode: `2`
            - 构建 SHA: `${GITHUB_SHA:0:7}`

            ### 安装包
            - **Android APK**: 在手机上开启「未知来源」后安装（debug 签名可直接安装）
            - **Windows**: `.msi` 安装包
            - **macOS**: `.dmg` 安装包
            - **Linux**: `.deb` 安装包

            ### 升级建议
            - 首次安装或升级时若提示签名不匹配,请卸载旧版本后重新安装
          files: |
            artifacts/**/*.apk
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
          draft: false
          prerelease: false
